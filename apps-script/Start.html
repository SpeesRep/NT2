<!doctype html>
<html lang="nl">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include_('TeacherStyle') ?>
</head>
<body>
<script>var CTX = <?!= ctx ?>;</script>
<?!= include_('TeacherStrings') ?>
<?!= include_('TeacherNav') ?>
<main>
  <h1 id="title"></h1>
  <p id="intro" class="meta"></p>
  <div class="tiles">
    <a class="tile" id="tReview" target="_top"><h2></h2><p></p></a>
    <a class="tile" id="tCurriculum" target="_top"><h2></h2><p></p></a>
    <section class="tile share" id="tPublish"><h2></h2><p></p><p><button class="btn primary" id="publishBtn"></button> <span id="publishMsg" class="meta"></span></p><p class="meta"><span id="publishLast"></span> · <a id="publishRuns" target="_blank" rel="noopener"></a></p></section>
    <section class="tile share" id="tShare"><h2></h2><p id="shareLink"></p><ol id="shareSteps"></ol><p class="meta" id="shareNote"></p></section>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $('title').textContent = tr('start.title');
  $('intro').textContent = tr('start.intro');
  [['tReview', 'review'], ['tCurriculum', 'curriculum']].forEach(function (x) {
    var a = $(x[0]);
    a.href = CTX.urls[x[1]];
    a.querySelector('h2').textContent = tr('start.' + x[1] + '.title');
    a.querySelector('p').textContent = tr('start.' + x[1] + '.text');
    if (x[1] === 'review' && todoText()) {
      var dot = document.createElement('span'); dot.className = 'dot'; a.querySelector('h2').appendChild(dot);
      var line = document.createElement('p'); line.textContent = todoText(); line.style.fontWeight = '600'; a.appendChild(line);
    }
  });
  $('tShare').querySelector('h2').textContent = tr('start.share.title');
  var p = $('shareLink');
  p.appendChild(document.createTextNode(tr('start.share.link') + ' '));
  var code = document.createElement('code'); code.textContent = CTX.appUrl; p.appendChild(code);
  tr('start.share.steps').forEach(function (s) { var li = document.createElement('li'); li.textContent = s; $('shareSteps').appendChild(li); });
  $('shareNote').textContent = tr('start.share.note', { env: CTX.env });

  // Publiceren: GitHub rebuilds the site with every group's word list (Publish.gs → deploy.yml).
  var pub = $('tPublish'), btn = $('publishBtn'), msg = $('publishMsg');
  pub.querySelector('h2').textContent = tr('start.publish.title');
  pub.querySelector('p').textContent = tr('start.publish.text', { env: CTX.env });
  btn.textContent = tr('start.publish.button', { env: CTX.env });
  var when = function (iso) { return iso ? new Date(iso).toLocaleString('nl-BE', { dateStyle: 'medium', timeStyle: 'short' }) : ''; };
  var showLast = function (iso) { $('publishLast').textContent = iso ? tr('start.publish.last', { at: when(iso) }) : tr('start.publish.never'); };
  showLast(CTX.publish.last);
  $('publishRuns').textContent = tr('start.publish.runs');
  $('publishRuns').href = CTX.publish.runs;
  btn.addEventListener('click', function () {
    if (!confirm(tr('start.publish.confirm', { env: CTX.env }))) return;
    btn.disabled = true; msg.textContent = tr('start.publish.busy');
    google.script.run
      .withSuccessHandler(function (r) { btn.disabled = false; msg.textContent = tr('start.publish.done'); showLast(r.at); })
      .withFailureHandler(function (e) { btn.disabled = false; msg.textContent = tr('start.publish.error', { msg: e.message }); })
      .reviewPublish();
  });
})();
</script>
</body>
</html>
