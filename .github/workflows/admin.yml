name: Admin action

# Runs ONE admin action of the Apps Script API with the ADMIN_KEY_<ENV> secret (the owner's admin key; the server
# keeps only its hash), so it also works without the key on this machine. Manual only (Actions → Admin action → Run workflow, or `gh workflow run admin.yml -f env=dev
# -f action=migrateV2 -f payload='{"dryRun":true}'`). Writing actions are dry runs unless the payload says
# "dryRun": false. The result (JSON, never the token) is printed and added to the run summary.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: Admin action (e.g. admin.overview, admin.createGroup, readTab, migrateV2)
        type: string
        default: admin.overview
      payload:
        description: JSON payload (e.g. {"dryRun":false} or {"tab":"Groups"})
        default: '{}'

permissions:
  contents: read

concurrency:
  group: admin-${{ github.event.inputs.env }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ${{ github.event.inputs.action }} on ${{ github.event.inputs.env }}
        env:
          API_URL_DEV: ${{ secrets.API_URL_DEV }}
          API_URL_PROD: ${{ secrets.API_URL_PROD }}
          ADMIN_KEY_DEV: ${{ secrets.ADMIN_KEY_DEV }}
          ADMIN_KEY_PROD: ${{ secrets.ADMIN_KEY_PROD }}
          ADMIN_TOKEN_DEV: ${{ secrets.ADMIN_TOKEN_DEV }}
          ADMIN_TOKEN_PROD: ${{ secrets.ADMIN_TOKEN_PROD }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          node scripts/admin.mjs "${{ github.event.inputs.env }}" "${{ github.event.inputs.action }}" "$PAYLOAD" | tee result.json
          { echo '```json'; head -c 60000 result.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
