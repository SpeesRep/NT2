name: Deploy to GitHub Pages

# One Pages artifact, two apps:
#   release branch → PROD at /NT2/
#   main branch    → DEV  at /NT2/dev/
on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (DEV)
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Does the release branch exist?
        id: release
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" release >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release (PROD)
        if: steps.release.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: release
          path: release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Secret scan (source only, not dist)
        run: |
          (cd main && scripts/check-secrets.sh --tree)
          if [ -d release ]; then (cd release && scripts/check-secrets.sh --tree); fi

      - name: DEV — install, test, build
        working-directory: main
        env:
          API_URL_DEV: ${{ secrets.API_URL_DEV }}
        run: |
          # Build label = the commit actually built (not the commit that triggered this run).
          export SPEESREP_BUILD_ID="$(git rev-parse --short HEAD)"
          npm ci
          npm run typecheck
          npm test
          npm run ui-vocab                       # warnings only
          npm run ui-strings -- --check || echo "::warning::docs/UI-STRINGS.md is stale — run npm run ui-strings"
          npm run build:dev

      - name: DEV — end-to-end offline test (Playwright)
        working-directory: main
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: PROD — install, build
        if: steps.release.outputs.exists == 'true'
        working-directory: release
        env:
          API_URL_PROD: ${{ secrets.API_URL_PROD }}
        run: |
          export SPEESREP_BUILD_ID="$(git rev-parse --short HEAD)"
          npm ci
          npm run build:prod

      - name: Assemble site
        run: |
          mkdir -p site
          if [ -d release/dist ]; then
            cp -R release/dist/. site/
          else
            printf '<!doctype html><meta charset="utf-8"><title>SpeesRep</title><p>La version PROD arrive bientôt. <a href="dev/">Version DEV</a></p>' > site/index.html
          fi
          rm -rf site/dev
          cp -R main/dist/dev site/dev
          touch site/.nojekyll
          find site -maxdepth 2 | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
